[project]
name = "gradmatch-api"
version = "0.1.0"
description = "GradMatch API service foundation for future Django integration."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pyright>=1.1.405,<2",
  "pytest>=8.4.1,<9",
  "pytest-django>=4.11.1,<5",
  "ruff>=0.13.0,<0.14"
]

[tool.hatch.build.targets.wheel]
packages = ["src/gradmatch"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
