[project]
name = "gradmatch-api"
version = "0.1.0"
description = "GradMatch API service foundation for future Django integration."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.40.0,<2",
  "celery>=5.5,<6",
  "Django>=5.2,<5.3",
  "django-allauth[headless,headless-spec,socialaccount]>=65.19,<66",
  "django-ninja>=1.4.5,<2",
  "httpx>=0.28,<0.29",
  "playwright>=1.54,<2",
  "psycopg[binary]>=3.2.0,<4",
  "redis>=6.4.0,<7",
  "uvicorn[standard]>=0.35.0,<0.36",
  "whitenoise>=6.9.0,<7",
]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.40,<2",
  "django-stubs>=5.2,<6",
  "pyright>=1.1.405,<2",
  "pytest>=8.4.1,<9",
  "pytest-django>=4.11.1,<5",
  "ruff>=0.13.0,<0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gradmatch"]

[tool.pytest.ini_options]
addopts = "-ra"
DJANGO_SETTINGS_MODULE = "gradmatch.config.settings_test"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/gradmatch/**/migrations/*.py" = ["E501", "I001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
